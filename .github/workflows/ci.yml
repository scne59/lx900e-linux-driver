name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config python3 \
            libcups2-dev libusb-1.0-0-dev cups-ipp-utils \
            ghostscript cups-ppdc
          # PAPPL is not in every Ubuntu pocket; without it the application
          # is skipped, with it (1.3 or newer) the integration test runs.
          sudo apt-get install -y libpappl-dev || true
          sudo apt-get install -y shellcheck || true

      - name: Build and test
        env:
          LC_ALL: C
        run: make test

      - name: Sanitizers (encoder)
        run: |
          cc -O1 -g -fsanitize=address,undefined \
             -o build/rastertoLX900-asan driver/rastertoLX900.c \
             src/lx900_encoder.c -Iinclude -lcups
          LX900_FILTER="$PWD/build/rastertoLX900-asan" \
             python3 tests/test_encoder.py

      - name: Sanitizers (printer application)
        run: |
          if ! pkg-config --exists pappl; then
            echo "PAPPL is not installed; skipping the application sanitizer run"
            exit 0
          fi
          cc -O1 -g -fsanitize=address,undefined -D_GNU_SOURCE \
             -DLX900_APP_VERSION=\"ci\" -DHAVE_LIBUSB -Iinclude \
             $(pkg-config --cflags pappl cups libusb-1.0) \
             -o build/lx900e-app-asan pappl/lx900-app.c \
             src/lx900_encoder.c src/lx900_status.c \
             $(pkg-config --libs pappl cups libusb-1.0) -lm
          # PAPPL leaks a USB config descriptor in papplDeviceList(); leak
          # detection is off here so the test sees the application's exit
          # status, not PAPPL's leak report.  The encoder run above keeps it on.
          set +e
          ASAN_OPTIONS=detect_leaks=0 \
             LX900_APP="$PWD/build/lx900e-app-asan" \
             python3 tests/pappl-integration.py -v > /tmp/app-test.log 2>&1
          rc=$?
          cat /tmp/app-test.log
          if [ $rc -ne 0 ]; then
            tail -40 /tmp/app-test.log | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi
          exit $rc

      - name: shellcheck
        continue-on-error: true
        run: shellcheck -S warning tools/*.sh install.sh tests/*.sh
